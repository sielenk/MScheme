<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MScheme</title>
  <style>
    body {
      background: #000;
      color: #33ff33;
      font-family: monospace;
      font-size: 14px;
      margin: 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: normal;
      margin: 0 0 8px 0;
    }

    #scheme-output {
      width: 100%;
      height: 400px;
      overflow-y: scroll;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #33ff33;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }

    #scheme-input {
      width: calc(100% - 56px);
      background: #000;
      color: #33ff33;
      border: 1px solid #33ff33;
      font-family: monospace;
      font-size: 14px;
      padding: 4px;
      box-sizing: border-box;
      resize: vertical;
    }

    #scheme-eval {
      width: 48px;
      background: #000;
      color: #33ff33;
      border: 1px solid #33ff33;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
      vertical-align: top;
      padding: 4px;
    }

    #scheme-eval:hover {
      background: #33ff33;
      color: #000;
    }
  </style>
</head>
<body>
<h1>MScheme REPL &mdash; Enter to eval, Shift+Enter for newline</h1>
<div id="scheme-output"></div>
<textarea id="scheme-input" rows="3"></textarea>
<button id="scheme-eval">Eval</button>
<script src="MScheme.js"></script>
</body>
</html>
